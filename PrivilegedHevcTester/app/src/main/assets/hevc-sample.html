<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HEVC WebView Smoke</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #f2f2f2;
      padding: 12px;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    #meta, #log {
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
      word-break: break-word;
      background: #1c1c1c;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    video {
      width: 100%;
      max-height: 55vh;
      background: #000;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <h1>HEVC &lt;video&gt; smoke</h1>
  <div id="meta"></div>
  <video id="v" controls playsinline preload="metadata" src="hevc-lesson.mp4"></video>
  <div id="log"></div>
  <script>
    const logEl = document.getElementById('log');
    const metaEl = document.getElementById('meta');
    const v = document.getElementById('v');
    function log(msg) {
      const line = '[' + new Date().toISOString().slice(11, 19) + '] ' + msg;
      logEl.textContent += line + '\n';
      console.log(line);
    }
    const canHvc1 = v.canPlayType('video/mp4; codecs="hvc1"');
    const canHev1 = v.canPlayType('video/mp4; codecs="hev1"');
    metaEl.textContent =
      'UA: ' + navigator.userAgent + '\n' +
      'canPlayType hvc1: "' + canHvc1 + '"\n' +
      'canPlayType hev1: "' + canHev1 + '"\n' +
      'src: ' + v.currentSrc;
    ['loadstart','loadedmetadata','loadeddata','canplay','canplaythrough','playing','error','stalled','abort'].forEach(function (ev) {
      v.addEventListener(ev, function () {
        if (ev === 'error') {
          const err = v.error;
          log('error code=' + (err && err.code) + ' message=' + (err && err.message));
        } else if (ev === 'loadedmetadata') {
          log(ev + ' size=' + v.videoWidth + 'x' + v.videoHeight + ' duration=' + v.duration);
        } else {
          log(ev);
        }
      });
    });
    v.play().then(function () { log('play() resolved'); }).catch(function (e) { log('play() rejected: ' + e); });
  </script>
</body>
</html>
